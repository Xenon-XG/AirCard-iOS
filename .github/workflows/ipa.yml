name: 编译并发布 IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译无签名 IPA
        run: ./build-ipa.sh Release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-zh-unsigned-${{ github.run_number }}
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 发布标签版本
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/AirCard-iOS.ipa \
            --verify-tag \
            --title "AirCard-iOS 简体中文版 $RELEASE_TAG" \
            --notes "基于 Mak5er/AirCard-iOS 的简体中文版本。IPA 未签名；安装前请使用 SideStore、AltStore 或其他受信任的方式重新签名。"
